<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cursos</title>

<!-- PWA: manifiesto e íconos -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<!-- iPhone / iPad -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cursos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Cursos">

<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0b0d12;color:#eef1f6;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
    background:radial-gradient(600px 360px at 50% 20%, rgba(139,123,255,.18), transparent 70%),#0b0d12}
  .box{text-align:center;max-width:380px;width:100%}
  img.logo{width:132px;height:132px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6))}
  h1{margin:18px 0 4px;font-size:28px;letter-spacing:-.02em}
  p{color:#9aa3b5;margin:6px 0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;min-height:50px;padding:0 26px;
    border-radius:14px;border:0;font:inherit;font-weight:700;color:#fff;cursor:pointer;text-decoration:none;
    background:linear-gradient(135deg,#8b7bff,#6a5cff);box-shadow:0 8px 24px rgba(106,92,255,.4)}
  .lnk{display:inline-block;margin-top:18px;color:#7c8599;font-size:13px;background:none;border:0;cursor:pointer;text-decoration:underline}
  input{width:100%;box-sizing:border-box;margin-top:14px;padding:13px 14px;border-radius:12px;border:1px solid #303848;
    background:#0e1219;color:#eef1f6;font:inherit}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid #303848;border-top-color:#8b7bff;margin:22px auto 0;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="icons/logo-transparente.png" alt="Cursos">
  <h1>Cursos</h1>
  <p>Asistencia y calificaciones</p>

  <!-- Abriendo la app -->
  <div id="abriendo" class="hidden">
    <div class="spin"></div>
    <p style="margin-top:12px">Abriendo…</p>
  </div>

  <!-- Botón (si la app no se abrió sola, o al volver atrás) -->
  <div id="listo" class="hidden">
    <a class="btn" id="abrir" href="#">Abrir Cursos</a><br>
    <button class="lnk" onclick="configurar()">Cambiar el enlace de mi app</button>
  </div>

  <!-- Primera vez: pegar el enlace de la app -->
  <div id="config" class="hidden">
    <p style="margin-top:18px">Pegue aquí el enlace de <b>su</b> app de Apps Script<br>(el que termina en <b>/exec</b>):</p>
    <input id="url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <button class="btn" onclick="guardar()">Guardar y abrir</button>
    <p id="err" style="color:#ff8080;font-size:13px"></p>
  </div>
</div>

<script>
  /* ============================================================
     OPCIONAL: pegue aquí el enlace de su app (termina en /exec).
     Si lo deja vacío, la app lo pide la primera vez y lo recuerda
     en ese celular (así el mismo lanzador sirve para colegas).
     ============================================================ */
  var APP_URL = '';

  var CLAVE = 'cursos_app_url';
  function leer(){ try { return localStorage.getItem(CLAVE) || ''; } catch(e){ return ''; } }
  function escribir(v){ try { localStorage.setItem(CLAVE, v); } catch(e){} }
  function valido(u){ return /^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[\w-]+\/(exec|dev)(\?.*)?$/.test(u.trim()); }
  function ver(id){ ['abriendo','listo','config'].forEach(function(k){ document.getElementById(k).classList.toggle('hidden', k!==id); }); }
  function destino(){ return APP_URL || leer(); }

  function abrir(auto){
    var u = destino();
    if(!u){ ver('config'); return; }
    document.getElementById('abrir').href = u;
    if(auto){ ver('abriendo'); setTimeout(function(){ location.href = u; }, 350); setTimeout(function(){ ver('listo'); }, 2500); }
    else ver('listo');
  }
  function configurar(){ document.getElementById('url').value = leer(); ver('config'); }
  function guardar(){
    var u = document.getElementById('url').value.trim();
    if(!valido(u)){ document.getElementById('err').textContent = 'Ese enlace no parece de Apps Script. Debe empezar con https://script.google.com/ y terminar en /exec'; return; }
    escribir(u); APP_URL = APP_URL || ''; abrir(true);
  }

  // Al abrir: ir directo a la app. Si el usuario vuelve atrás, mostrar el botón (no redirigir en bucle).
  window.addEventListener('pageshow', function(ev){
    var volvio = ev.persisted || (performance.getEntriesByType && (performance.getEntriesByType('navigation')[0]||{}).type === 'back_forward');
    abrir(!volvio);
  });

  // Service Worker (necesario para que Android permita instalarla como app)
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
</script>
</body>
</html>
